<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Tickets — BookMyShow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --ink: #0A0A12;
      --ink2: #12121E;
      --ink3: #1A1A2E;
      --surface: #1F1F32;
      --surface2: #272740;
      --border: rgba(255, 255, 255, 0.06);
      --border2: rgba(255, 255, 255, 0.12);
      --txt: #F2F2FA;
      --txt2: #8A8AAF;
      --txt3: #45456A;
      --red: #E8132A;
      --red2: rgba(232, 19, 42, 0.15);
      --red-glow: rgba(232, 19, 42, 0.3);
      --gold: #F5A623;
      --teal: #00C9A7;
      --blue: #4C8BFF;
      --serif: 'Playfair Display', 'Georgia', serif;
      --sans: 'DM Sans', 'Helvetica Neue', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--ink);
      color: var(--txt);
      min-height: 100vh
    }

    ::-webkit-scrollbar {
      width: 3px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red)
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(10, 10, 18, 0.97);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border)
    }

    .logo {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 900;
      color: var(--txt);
      text-decoration: none
    }

    .logo span {
      color: var(--red)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      transition: all .18s;
      text-decoration: none;
      white-space: nowrap
    }

    .btn-red {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 20px var(--red-glow)
    }

    .btn-red:hover {
      background: #c4001f;
      transform: translateY(-1px)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      color: var(--txt);
      border: 1px solid var(--border2)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.12)
    }

    .btn-lg {
      padding: 14px 32px;
      font-size: 15px;
      border-radius: 12px
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 8px
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none !important
    }

    /* STEPS */
    .steps {
      background: var(--ink2);
      border-bottom: 1px solid var(--border);
      margin-top: 64px;
      padding: 0 28px
    }

    .steps-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: stretch
    }

    .step-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--txt3);
      border-bottom: 3px solid transparent;
      cursor: default;
      transition: .2s;
      flex-shrink: 0
    }

    .step-tab .snum {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: .2s
    }

    .step-tab.active {
      color: var(--txt);
      border-bottom-color: var(--red)
    }

    .step-tab.active .snum {
      background: var(--red);
      border-color: var(--red);
      color: #fff
    }

    .step-tab.done .snum {
      background: var(--teal);
      border-color: var(--teal);
      color: #000
    }

    .step-tab.done {
      color: var(--txt2);
      cursor: pointer !important;
    }

    .step-tab.done:hover {
      color: var(--txt);
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
    }

    .step-tab.done:hover .snum {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(0, 255, 212, .4);
    }

    .step-sep {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border2);
      font-size: 18px
    }

    /* LAYOUT */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 28px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start
    }

    .main-col {}

    .side-col {
      position: sticky;
      top: 86px
    }

    /* MOVIE BANNER */
    .movie-banner {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .mb-img {
      width: 100%;
      height: 180px;
      position: relative;
      overflow: hidden
    }

    .mb-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.65)
    }

    .mb-img-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--surface) 0%, transparent 50%, var(--surface) 100%), linear-gradient(to top, var(--surface) 0%, transparent 60%)
    }

    .mb-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 18px 20px;
      gap: 14px
    }

    .mb-poster {
      width: 72px;
      height: 100px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border2);
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .6)
    }

    .mb-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .mb-info {}

    .mb-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #fff
    }

    .mb-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .mb-tag {
      background: rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .8);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15)
    }

    /* PANEL */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 18px
    }

    .panel-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--txt)
    }

    /* SHOW SLOTS */
    .slots-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .slot {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border2);
      background: transparent;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--txt2);
      cursor: pointer;
      transition: .15s
    }

    .slot:hover {
      border-color: var(--red);
      color: var(--txt)
    }

    .slot.on {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      box-shadow: 0 4px 12px var(--red-glow)
    }

    .slot.full {
      opacity: .3;
      cursor: not-allowed;
      pointer-events: none
    }

    .slot-avail {
      font-size: 10px;
      color: rgba(255, 255, 255, .6);
      display: block;
      margin-top: 1px
    }

    /* ── SEAT SELECTOR — CINEMA STYLE ── */
    .seat-wrap {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px
    }

    /* SCREEN CURVE */
    .screen-area {
      margin-bottom: 36px;
      text-align: center
    }

    .screen-arc {
      width: 75%;
      margin: 0 auto;
      height: 40px;
      border: 3px solid;
      border-color: var(--red) transparent transparent transparent;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .screen-arc::before {
      content: 'S C R E E N';
      position: absolute;
      top: -22px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--txt3);
    }

    .screen-glow {
      width: 70%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      border-radius: 2px;
      margin: 8px auto 0;
      box-shadow: 0 0 20px var(--red-glow);
    }

    /* LEGEND */
    .seat-legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--txt2)
    }

    .leg-box {
      width: 20px;
      height: 18px;
      border-radius: 5px
    }

    /* SEAT AREA */
    .seat-area {
      overflow-x: auto;
      padding-bottom: 8px;
      display: flex;
      justify-content: center;
    }

    .seat-stage {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 auto;
    }

    .seat-row-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .row-label {
      width: 22px;
      font-size: 12px;
      font-weight: 700;
      color: var(--txt3);
      text-align: center;
      flex-shrink: 0;
      font-family: var(--serif)
    }

    .seats {
      display: flex;
      gap: 5px;
      align-items: center
    }

    .seat {
      width: 32px;
      height: 28px;
      border-radius: 6px 6px 3px 3px;
      border: none;
      cursor: pointer;
      font-size: 0;
      transition: all .12s;
      position: relative;
      flex-shrink: 0;
    }

    /* Seat "back" shape */
    .seat::before {
      content: '';
      position: absolute;
      top: 0;
      left: 2px;
      right: 2px;
      height: 10px;
      border-radius: 4px 4px 0 0;
      background: rgba(255, 255, 255, .08);
    }

    .seat.avail {
      background: var(--surface2);
      border: 1.5px solid var(--border2)
    }

    .seat.avail:hover {
      background: rgba(232, 19, 42, .2);
      border-color: var(--red);
      transform: scale(1.1);
      cursor: pointer
    }

    .seat.selected {
      background: var(--red);
      border: 1.5px solid var(--red);
      transform: scale(1.05)
    }

    .seat.selected::before {
      background: rgba(255, 255, 255, .2)
    }

    .seat.booked {
      background: var(--border);
      border: 1.5px solid var(--border);
      cursor: not-allowed;
      opacity: .4
    }

    .seat.premium.avail {
      background: rgba(245, 166, 35, .08);
      border-color: rgba(245, 166, 35, .3)
    }

    .seat.premium.avail:hover {
      background: rgba(245, 166, 35, .2);
      border-color: var(--gold)
    }

    .seat.premium.selected {
      background: var(--gold);
      border-color: var(--gold)
    }

    .seat.gold-seat.avail {
      background: rgba(167, 139, 250, .08);
      border-color: rgba(167, 139, 250, .3)
    }

    .seat.gold-seat.avail:hover {
      background: rgba(167, 139, 250, .2);
      border-color: #a78bfa
    }

    .seat.gold-seat.selected {
      background: #a78bfa;
      border-color: #a78bfa
    }

    .aisle {
      width: 16px;
      flex-shrink: 0
    }

    .col-nums {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0 0 6px 30px
    }

    .col-num {
      width: 32px;
      text-align: center;
      font-size: 10px;
      color: var(--txt3);
      font-weight: 600;
      flex-shrink: 0
    }

    .col-aisle {
      width: 16px;
      flex-shrink: 0
    }

    /* TIER LABELS */
    .tier-label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--txt3);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 6px 0 4px
    }

    /* TICKET DETAILS BOX */
    .ticket-box {
      background: var(--ink2);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 16px
    }

    .tb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--border)
    }

    .tb-row:last-child {
      border-bottom: none
    }

    .tb-lbl {
      color: var(--txt2)
    }

    .tb-val {
      font-weight: 600
    }

    .tb-seats {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .seat-badge {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 6px
    }

    .tb-total .tb-lbl {
      font-weight: 700;
      color: var(--txt);
      font-size: 15px
    }

    .tb-total .tb-val {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--teal)
    }

    /* BOOKING SUMMARY SIDEBAR */
    .summary {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px
    }

    .sum-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border)
    }

    .sum-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 11px;
      gap: 10px
    }

    .sum-lbl {
      color: var(--txt2)
    }

    .sum-val {
      font-weight: 600;
      text-align: right;
      max-width: 160px
    }

    .sum-div {
      border: none;
      border-top: 1px solid var(--border);
      margin: 14px 0
    }

    .sum-total .sum-lbl {
      font-weight: 700;
      color: var(--txt);
      font-size: 15px
    }

    .sum-total .sum-val {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--red)
    }

    /* PAYMENT */
    .pay-opt {
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: .18s;
      margin-bottom: 10px
    }

    .pay-opt:hover {
      background: var(--surface2)
    }

    .pay-opt.on {
      border-color: var(--red);
      background: var(--red2)
    }

    .pay-icon {
      font-size: 22px
    }

    .pay-name {
      font-weight: 600;
      font-size: 14px
    }

    .pay-sub {
      font-size: 12px;
      color: var(--txt2);
      margin-top: 1px
    }

    .pay-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      margin-left: auto;
      flex-shrink: 0
    }

    .pay-opt.on .pay-radio {
      border-color: var(--red);
      background: var(--red);
      box-shadow: inset 0 0 0 4px var(--surface)
    }

    /* USER FORM */
    .fl {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px
    }

    .fl label {
      font-size: 11px;
      font-weight: 600;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 1px
    }

    .fl input {
      background: var(--ink2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--txt);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: .18s;
      width: 100%
    }

    .fl input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red2)
    }

    .fl input::placeholder {
      color: var(--txt3)
    }

    /* CONFIRM */
    .confirm-box {
      text-align: center;
      padding: 40px 20px
    }

    .c-icon {
      width: 80px;
      height: 80px;
      background: rgba(0, 201, 167, .1);
      border: 2px solid var(--teal);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px
    }

    .c-title {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px
    }

    .c-num {
      font-family: monospace;
      font-size: 15px;
      background: var(--ink2);
      padding: 8px 20px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 22px;
      color: var(--gold);
      letter-spacing: 1px;
      border: 1px solid var(--border2)
    }

    .c-table {
      background: var(--ink2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-align: left;
      margin-bottom: 22px
    }

    .c-row {
      display: flex;
      justify-content: space-between;
      padding: 11px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border)
    }

    .c-row:last-child {
      border-bottom: none
    }

    .c-lbl {
      color: var(--txt2)
    }

    .c-val {
      font-weight: 600
    }

    /* TOAST */
    .tw {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .t {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 13px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      min-width: 240px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
      animation: tIn .3s ease
    }

    .t.ok {
      border-left: 3px solid var(--teal)
    }

    .t.err {
      border-left: 3px solid var(--red)
    }

    @keyframes tIn {
      from {
        transform: translateX(60px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes tOut {
      to {
        transform: translateX(60px);
        opacity: 0
      }
    }

    @media(max-width:860px) {
      .page {
        grid-template-columns: 1fr
      }

      .side-col {
        position: static
      }

      .page {
        padding: 20px
      }
    }

    @media(max-width:560px) {
      .nav {
        padding: 0 16px;
        height: 58px
      }

      .page {
        padding: 16px
      }

      .seat {
        width: 26px;
        height: 22px
      }

      .seats {
        gap: 4px
      }

      .aisle {
        width: 10px
      }

      .col-num {
        width: 26px
      }

      .seat::before {
        display: none
      }

      .col-nums {
        padding-left: 30px
      }

      .btn {
        min-height: 44px
      }

      h2 {
        font-size: 22px
      }
    }

    /* ══ BOOKMYSHOW BRAND ══ */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .brand-mark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #FF1A1A;
      clip-path: polygon(0 15%, 50% 0, 100% 15%, 100% 85%, 50% 100%, 0 85%);
      animation: bPulse 3s ease-in-out infinite
    }

    @keyframes bPulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.08)
      }
    }

    .brand-f {
      position: relative;
      font-family: 'Unbounded', 'Impact', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #fff
    }

    .brand-name {
      font-family: 'Unbounded', 'Impact', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #F0F0FF
    }

    .brand-name em {
      color: #FF1A1A;
      font-style: normal
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="brand" href="index.html">
      <div class="brand-mark">
        <div class="brand-f">B</div>
      </div>
      <div class="brand-name">BOOK<em>MY</em>SHOW</div>
    </a>
    <a href="movies.html" class="btn btn-ghost btn-sm">← Back to Movies</a>
  </nav>

  <!-- STEPS -->
  <div class="steps">
    <div class="steps-inner">
      <div class="step-tab active" id="st1" onclick="goToStep(1)" style="cursor:pointer">
        <div class="snum">1</div><span>Select Show</span>
      </div>
      <div class="step-sep">›</div>
      <div class="step-tab" id="st2" onclick="goToStep(2)" style="cursor:pointer">
        <div class="snum">2</div><span>Pick Seats</span>
      </div>
      <div class="step-sep">›</div>
      <div class="step-tab" id="st3" onclick="goToStep(3)" style="cursor:pointer">
        <div class="snum">3</div><span>Your Details</span>
      </div>
      <div class="step-sep">›</div>
      <div class="step-tab" id="st4" onclick="goToStep(4)" style="cursor:pointer">
        <div class="snum">4</div><span>Payment</span>
      </div>
      <div class="step-sep">›</div>
      <div class="step-tab" id="st5">
        <div class="snum">✓</div><span>Confirm</span>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="main-col" id="mainCol"></div>
    <div class="side-col">
      <div class="summary">
        <div class="sum-title">🎬 Booking Summary</div>
        <div class="sum-row"><span class="sum-lbl">Movie</span><span class="sum-val" id="sumMovie">—</span></div>
        <div class="sum-row"><span class="sum-lbl">Show</span><span class="sum-val" id="sumShow">—</span></div>
        <div class="sum-row"><span class="sum-lbl">Venue</span><span class="sum-val" id="sumVenue">—</span></div>
        <div class="sum-row"><span class="sum-lbl">Seats</span><span class="sum-val" id="sumSeats">None</span></div>
        <hr class="sum-div" />
        <div class="sum-row sum-total"><span class="sum-lbl">Total</span><span class="sum-val" id="sumTotal">₹0</span>
        </div>
        <button class="btn btn-red btn-lg" style="width:100%;margin-top:18px;justify-content:center" id="nextBtn"
          onclick="nextStep()">Continue →</button>
      </div>
    </div>
  </div>

  <div class="tw" id="tw"></div>

  <script>
    const BASE = 'http://localhost:8080';
    const params = new URLSearchParams(location.search);
    let step = 1, allShows = [], curShow = null, selectedSeats = [], payMethod = '', userId = '', result = null;
    const movieId = params.get('movieId'), showId = params.get('showId');

    const FALLBACK_POSTERS = [
      'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400&auto=format&fit=crop&q=80',
      'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&auto=format&fit=crop&q=80',
      'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400&auto=format&fit=crop&q=80',
    ];

    async function api(m, p, b) { try { const o = { method: m, headers: { 'Content-Type': 'application/json' } }; if (b) o.body = JSON.stringify(b); const r = await fetch(BASE + p, o); const t = await r.text(); let d; try { d = JSON.parse(t) } catch { d = t } return { ok: r.ok, data: d } } catch { return { ok: false, data: { message: 'Cannot connect' } } } }
    function toast(msg, type = 'info') { const el = document.createElement('div'); el.className = 't ' + type; el.innerHTML = `<span>${{ ok: '✅', err: '❌', info: 'ℹ️' }[type] || '•'}</span><span>${msg}</span>`; document.getElementById('tw').appendChild(el); setTimeout(() => { el.style.animation = 'tOut .3s ease forwards'; setTimeout(() => el.remove(), 300) }, 3500) }

    function setSteps(n, pushState = true) {
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById('st' + i);
        if (!el) continue;
        el.className = 'step-tab' + (i < n ? ' done' : i === n ? ' active' : '');
        // Clickable only if step is already done (going back)
        el.style.cursor = (i < n) ? 'pointer' : 'default';
        el.style.opacity = (i > n) ? '0.4' : '1';
      }
      step = n;
      const nb = document.getElementById('nextBtn');
      if (nb) {
        nb.textContent = n === 4 ? 'Confirm Booking →' : 'Continue →';
        nb.disabled = false;
        nb.style.display = n === 5 ? 'none' : '';
      }
      // ✅ FIX: Push state to browser history so back button works step by step
      if (pushState) history.pushState({ step: n }, '', location.href.split('?')[0] + location.search);
    }

    // Called when user clicks a step tab — can go back to any completed step
    function goToStep(n) {
      if (n === step) return; // already here
      if (n > step) return;   // can't jump forward

      // Guard: only go back if that step's data exists
      if (n === 1) { renderStep1(true); return; }
      if (n === 2) {
        if (!curShow) { toast('Please select a show first', 'err'); return; }
        renderStep2(true); return;
      }
      if (n === 3) {
        if (!curShow) { toast('Please select a show first', 'err'); return; }
        if (!selectedSeats.length) { toast('Please select seats first', 'err'); return; }
        renderStep3(true); return;
      }
      if (n === 4) {
        if (!curShow) { toast('Please select a show first', 'err'); return; }
        if (!selectedSeats.length) { toast('Please select seats first', 'err'); return; }
        if (!userId) { toast('Please enter your details first', 'err'); return; }
        renderStep4(true); return;
      }
    }

    // Browser back button: go one step back, exit to movies only from step 1
    window.addEventListener('popstate', (e) => {
      const s = e.state?.step;
      if (s === undefined || s === null || s === 0) {
        // Base state or no state = exit to movies
        location.href = 'movies.html';
      } else if (s === 1) {
        renderStep1(false);
      } else if (s === 2) {
        if (curShow) renderStep2(false); else renderStep1(false);
      } else if (s === 3) {
        if (curShow && selectedSeats.length) renderStep3(false); else renderStep2(false);
      } else if (s === 4) {
        if (curShow && selectedSeats.length && userId) renderStep4(false); else renderStep3(false);
      }
    });

    function fmt(s) { if (!s) return '—'; return new Date(s).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) }
    function fmtDate(s) { if (!s) return '—'; return new Date(s).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) }

    function updateSummary() {
      if (curShow) {
        document.getElementById('sumMovie').textContent = curShow.movie?.movieName || '—';
        document.getElementById('sumShow').textContent = fmt(curShow.startTime) + ' · ' + fmtDate(curShow.startTime);
        const sType = curShow.screen?.screenType;
        const typeTag = sType && sType !== 'STANDARD' ? ' · ' + sType : '';
        document.getElementById('sumVenue').textContent = (curShow.screen?.theater?.name || 'Theater') + ' · ' + (curShow.screen?.screenName || '') + typeTag;
      }
      const seatNums = selectedSeats.map(s => s.seatNumber || s.id).join(', ') || 'None';
      document.getElementById('sumSeats').textContent = seatNums;
      const total = selectedSeats.reduce((a, s) => a + (s.baseprice || 200), 0);
      document.getElementById('sumTotal').textContent = '₹' + total.toLocaleString('en-IN');
    }

    // ─── STEP 1: SELECT SHOW ───
    async function renderStep1(push = true) {
      setSteps(1, push);
      document.getElementById('mainCol').innerHTML = `<div class="panel"><div class="panel-title">🎭 Select a Show</div><div id="showsWrap" style="text-align:center;padding:48px;color:var(--txt2)"><div style="font-size:36px;margin-bottom:12px">🔄</div>Loading shows...</div></div>`;
      const r = await api('GET', '/api/show/list');
      let shows = r.ok && Array.isArray(r.data) ? r.data : [];
      if (movieId) shows = shows.filter(s => String(s.movie?.id) === movieId || String(s.movieId) === movieId);
      allShows = shows;
      if (!shows.length) {
        document.getElementById('showsWrap').innerHTML = `<div style="text-align:center;padding:48px;color:var(--txt2)"><div style="font-size:48px;margin-bottom:16px">🎭</div><div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--txt);margin-bottom:10px">No Shows Available</div><div>Add shows in Admin panel first.</div><a href="admin.html" class="btn btn-red" style="margin-top:18px;display:inline-flex">Go to Admin →</a></div>`;
        return;
      }
      // Group by theater
      const theaters = {};
      shows.forEach(s => { const k = s.screen?.theater?.name || 'Theater'; if (!theaters[k]) theaters[k] = []; theaters[k].push(s) });
      let html = '';
      for (const [theater, tShows] of Object.entries(theaters)) {
        html += `<div style="margin-bottom:24px">
      <div style="font-weight:700;font-size:15px;margin-bottom:12px;color:var(--txt)">🏛️ ${theater}</div>
      <div style="font-size:12px;color:var(--txt3);margin-bottom:10px">${tShows[0]?.screen?.theater?.city || ''} · ${tShows[0]?.screen?.theater?.address || ''}</div>
      <div class="slots-grid">`;
        tShows.forEach(s => {
          const time = fmt(s.startTime);
          const avail = s.availableSeat?.length ?? 0;
          const isFull = avail === 0;
          const isSelected = s.id == showId;
          const screenType = s.screen?.screenType || '';
          const typeLabel = { IMAX: '🔭 IMAX', '4DX': '💺 4DX', '3D': '🥽 3D', DOLBY: '🔊 Dolby', SCREEN_X: '📐 ScreenX', STANDARD: '' }[screenType] || screenType;
          html += `<div class="slot${isFull ? ' full' : isSelected ? ' on' : ''}" id="slot${s.id}" onclick="pickShow(${s.id})">
        <div>${time}</div>
        ${typeLabel ? `<div style="font-size:10px;color:var(--gold);font-weight:700;margin-top:2px">${typeLabel}</div>` : ''}
        <div class="slot-avail" style="color:${isFull ? 'var(--red)' : avail < 10 ? 'var(--gold)' : 'var(--teal)'}">${isFull ? 'Houseful' : avail + ' seats'}</div>
      </div>`;
          if (isSelected) { curShow = s; updateSummary() }
        });
        html += `</div></div>`;
      }
      document.getElementById('showsWrap').innerHTML = html;
    }

    function pickShow(id) {
      curShow = allShows.find(s => s.id == id);
      document.querySelectorAll('.slot').forEach(el => el.classList.remove('on'));
      document.getElementById('slot' + id)?.classList.add('on');
      updateSummary();
      toast('Show selected!', 'ok');
    }

    // ─── STEP 2: SEAT SELECTOR ───
    function renderStep2(push = true) {
      setSteps(2, push);
      const seats = curShow?.availableSeat || [];
      const movie = curShow?.movie || {};
      const poster = FALLBACK_POSTERS[0];

      // ✅ FIX: Build seat grid DYNAMICALLY from real API data only
      // Group seats by row letter (A1→A, B3→B etc)
      const TYPE_COLOR = { RECLINER: 'var(--gold)', GOLD: '#a78bfa', NORMAL: 'var(--teal)' };
      const TYPE_CSS = { RECLINER: ' premium', GOLD: ' gold-seat', NORMAL: '' };

      const rows = {};
      seats.forEach(s => {
        const num = s.seat?.seatNumber;
        if (!num) return;
        const row = num.match(/^([A-Z]+)/)?.[1] || '?';
        if (!rows[row]) rows[row] = [];
        rows[row].push(s);
      });

      const sortedRows = Object.keys(rows).sort().reverse(); // J,I,H... screen is at top
      const seatsPerRow = sortedRows.length ? Math.max(...sortedRows.map(r => rows[r].length)) : 10;
      const halfCols = Math.ceil(seatsPerRow / 2);

      // Column header
      let colsHTML = `<div class="col-nums">`;
      for (let i = 1; i <= halfCols; i++) colsHTML += `<div class="col-num">${i}</div>`;
      colsHTML += `<div class="col-aisle"></div>`;
      for (let i = halfCols + 1; i <= seatsPerRow; i++) colsHTML += `<div class="col-num">${i}</div>`;
      colsHTML += `</div>`;

      // Build tier summary (unique types present)
      const allTypes = [...new Set(seats.map(s => s.seat?.seattype || 'NORMAL'))];
      const tierPrices = {};
      seats.forEach(s => { const t = s.seat?.seattype || 'NORMAL'; if (!tierPrices[t]) tierPrices[t] = s.seat?.baseprice || s.baseprice || '200'; });

      let rowsHTML = '';
      if (!sortedRows.length) {
        rowsHTML = `<div style="text-align:center;padding:40px;color:var(--txt3)">No seats available for this show.</div>`;
      } else {
        sortedRows.forEach(row => {
          const rowSeats = rows[row].sort((a, b) => {
            const na = parseInt(a.seat.seatNumber.replace(/[A-Z]+/, '')) || 0;
            const nb = parseInt(b.seat.seatNumber.replace(/[A-Z]+/, '')) || 0;
            return na - nb;
          });
          const seatType = rowSeats[0]?.seat?.seattype || 'NORMAL';
          const isPremium = seatType === 'RECLINER';
          const isGold = seatType === 'GOLD';
          rowsHTML += `<div class="seat-row-wrap">
        <div class="row-label">${row}</div>
        <div class="seats">`;
          rowSeats.forEach((s, i) => {
            const num = s.seat.seatNumber;
            const colIdx = parseInt(num.replace(/[A-Z]+/, '')) || (i + 1);
            if (colIdx === halfCols + 1) rowsHTML += `<div class="aisle"></div>`;
            const status = s.status || 'AVAILABLE';
            const isBooked = status === 'BOOKED' || status === 'LOCKED';
            const cls = isBooked ? 'booked' : 'avail';
            const price = parseFloat(s.seat?.baseprice || s.baseprice || 200);
            rowsHTML += `<div class="seat ${cls}${isPremium ? ' premium' : isGold ? ' gold-seat' : ''}" 
              id="s-${num}" title="${num} — ${seatType} ₹${price}" 
              onclick="toggleSeat('${num}',${s.id},${price})"></div>`;
          });
          rowsHTML += `</div><div class="row-label" style="margin-left:4px">${row}</div></div>`;
        });
      }

      // Dynamic legend from actual seat types
      const legendHTML = [
        `<div class="leg"><div class="leg-box" style="background:var(--surface2);border:1.5px solid var(--border2)"></div>Available</div>`,
        `<div class="leg"><div class="leg-box" style="background:var(--red)"></div>Selected</div>`,
        `<div class="leg"><div class="leg-box" style="background:var(--border);opacity:.4"></div>Sold Out</div>`,
        ...allTypes.map(t => `<div class="leg"><div class="leg-box" style="background:${TYPE_COLOR[t] || 'var(--teal)'}33;border:1.5px solid ${TYPE_COLOR[t] || 'var(--teal)'}"></div>${t} ₹${tierPrices[t]}</div>`)
      ].join('');

      document.getElementById('mainCol').innerHTML = `
  <div class="movie-banner">
    <div class="mb-img">
      <img src="${movie.bannerUrl || movie.posterUrl || poster}" alt="${movie.movieName || 'Movie'}" onerror="this.src='${poster}'"/>
      <div class="mb-img-grad"></div>
    </div>
    <div class="mb-content">
      <div class="mb-poster"><img src="${movie.posterUrl || poster}" onerror="this.src='${poster}'"/></div>
      <div class="mb-info">
        <div class="mb-title">${movie.movieName || 'Movie'}</div>
        <div class="mb-tags">
          ${movie.genre ? `<span class="mb-tag">${movie.genre}</span>` : ''}
          ${movie.language ? `<span class="mb-tag">${movie.language}</span>` : ''}
          ${movie.duration ? `<span class="mb-tag">⏱ ${movie.duration}</span>` : ''}
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,.6);margin-top:8px">
          🏛️ ${curShow?.screen?.theater?.name || 'Theater'} · ${fmt(curShow?.startTime)} · ${fmtDate(curShow?.startTime)}
        </div>
      </div>
    </div>
  </div>

  <div class="seat-wrap">
    <!-- SCREEN -->
    <div class="screen-area">
      <div class="screen-arc"></div>
      <div class="screen-glow"></div>
    </div>

    <!-- LEGEND — dynamic from seat types -->
    <div class="seat-legend">${legendHTML}</div>
    <div class="tier-label" style="color:var(--txt3)">— ${seats.length} seats · ${allTypes.join(' / ')} —</div>
    <div class="seat-area">
      <div class="seat-stage">
        ${colsHTML}
        ${rowsHTML}
      </div>
    </div>

    <!-- TICKET DETAILS -->
    <div class="ticket-box">
      <div style="font-weight:700;font-size:15px;margin-bottom:12px;color:var(--txt)">Ticket Details</div>
      <div class="tb-row"><span class="tb-lbl">Seats Selected</span><span class="tb-val" id="tbCount">0</span></div>
      <div class="tb-row"><span class="tb-lbl">Seat Numbers</span><span class="tb-val"><div class="tb-seats" id="tbSeats"><span style="color:var(--txt3)">None</span></div></span></div>
      <div class="tb-row tb-total"><span class="tb-lbl">Total Price</span><span class="tb-val" id="tbTotal">₹0</span></div>
    </div>
  </div>`;
    }

    function toggleSeat(num, id, price) {
      const el = document.getElementById('s-' + num);
      if (!el || el.classList.contains('booked')) return;
      // ✅ FIX: id=0 means seat not in API — prevent booking ghost seats
      if (!id || id === 0) { toast('This seat is unavailable for booking', 'err'); return; }
      const idx = selectedSeats.findIndex(s => s.seatNumber === num);
      if (idx >= 0) {
        selectedSeats.splice(idx, 1);
        el.classList.remove('selected');
        el.classList.add('avail');
      } else {
        if (selectedSeats.length >= 10) { toast('Max 10 seats per booking', 'err'); return }
        selectedSeats.push({ id, seatNumber: num, baseprice: price });
        el.classList.remove('avail');
        el.classList.add('selected');
      }
      // Update ticket box
      document.getElementById('tbCount').textContent = selectedSeats.length;
      document.getElementById('tbSeats').innerHTML = selectedSeats.length
        ? selectedSeats.map(s => `<span class="seat-badge">${s.seatNumber}</span>`).join('')
        : `<span style="color:var(--txt3)">None</span>`;
      const total = selectedSeats.reduce((a, s) => a + (s.baseprice || 200), 0);
      document.getElementById('tbTotal').textContent = '₹' + total.toLocaleString('en-IN');
      updateSummary();
    }

    // ─── STEP 3: USER DETAILS ───
    function renderStep3(push = true) {
      setSteps(3, push);
      document.getElementById('mainCol').innerHTML = `<div class="panel"><div class="panel-title">👤 Your Details</div>
    <div class="fl"><label>User ID *</label><input type="number" id="userId" placeholder="Enter your user ID" value="${userId}"/></div>
    <div style="font-size:13px;color:var(--txt2);background:var(--ink2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px">
      💡 Don't have a User ID? <a href="admin.html" style="color:var(--blue)">Create one in Admin panel</a> first.
    </div>
  </div>`;
    }

    // ─── STEP 4: PAYMENT ───
    function renderStep4(push = true) {
      setSteps(4, push);
      const methods = [{ id: 'UPI', icon: '📱', name: 'UPI', sub: 'GPay, PhonePe, Paytm' }, { id: 'CREDIT_CARD', icon: '💳', name: 'Credit Card', sub: 'Visa, Mastercard, Amex' }, { id: 'DEBIT_CARD', icon: '🏧', name: 'Debit Card', sub: 'All bank debit cards' }, { id: 'NET_BANKING', icon: '🏦', name: 'Net Banking', sub: 'All major banks' }];
      const total = selectedSeats.reduce((a, s) => a + (s.baseprice || 200), 0);
      document.getElementById('mainCol').innerHTML = `<div class="panel"><div class="panel-title">💳 Choose Payment</div>
    ${methods.map(m => `<div class="pay-opt${payMethod === m.id ? ' on' : ''}" id="pm-${m.id}" onclick="pickPay('${m.id}')">
      <div class="pay-icon">${m.icon}</div>
      <div><div class="pay-name">${m.name}</div><div class="pay-sub">${m.sub}</div></div>
      <div class="pay-radio"></div>
    </div>`).join('')}
    <div style="background:rgba(0,201,167,.06);border:1px solid rgba(0,201,167,.2);border-radius:12px;padding:14px;font-size:13px;color:var(--teal);margin-top:8px">
      🔒 Secure 256-bit SSL encrypted payment. Your card info is never stored.
    </div>
    <div style="background:var(--ink2);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:14px;color:var(--txt2)">${selectedSeats.length} Ticket${selectedSeats.length !== 1 ? 's' : ''} · ${selectedSeats.map(s => s.seatNumber).join(', ')}</div>
      <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--txt)">₹${total.toLocaleString('en-IN')}</div>
    </div>
  </div>`;
    }
    function pickPay(id) { payMethod = id; document.querySelectorAll('.pay-opt').forEach(el => el.classList.remove('on')); document.getElementById('pm-' + id)?.classList.add('on') }

    // ─── NEXT ───
    async function nextStep() {
      if (step === 1) { if (!curShow) { toast('Please select a show', 'err'); return } renderStep2() }
      else if (step === 2) { if (!selectedSeats.length) { toast('Select at least one seat', 'err'); return } renderStep3() }
      else if (step === 3) { userId = document.getElementById('userId')?.value?.trim(); if (!userId) { toast('Enter your User ID', 'err'); return } renderStep4() }
      else if (step === 4) {
        if (!payMethod) { toast('Choose a payment method', 'err'); return }
        const nb = document.getElementById('nextBtn');
        nb.disabled = true; nb.textContent = 'Processing...';
        const payload = { userId: parseInt(userId), showId: curShow.id, seatId: selectedSeats.map(s => s.id).filter(Boolean), paymentMethod: payMethod };
        const r = await api('POST', '/api/booking/create', payload);
        if (r.ok && r.data) { result = r.data; renderConfirm() }
        else { toast(r.data?.message || 'Booking failed. Please try again.', 'err'); nb.disabled = false; nb.textContent = 'Confirm Booking →' }
      }
    }

    // ─── CONFIRM ───
    function renderConfirm() {
      setSteps(5);
      document.getElementById('nextBtn').style.display = 'none';
      const b = result;
      const total = selectedSeats.reduce((a, s) => a + (s.baseprice || 200), 0);
      document.getElementById('mainCol').innerHTML = `<div class="panel"><div class="confirm-box">
    <div class="c-icon">🎉</div>
    <div class="c-title">Booking Confirmed!</div>
    <div style="color:var(--txt2);margin-bottom:14px">Your seats are locked in. Enjoy the movie!</div>
    <div class="c-num">${b.bookingNumber || 'BMS-' + b.id}</div>
    <div class="c-table">
      <div class="c-row"><span class="c-lbl">Movie</span><span class="c-val">${curShow?.movie?.movieName || 'Movie'}</span></div>
      <div class="c-row"><span class="c-lbl">Show</span><span class="c-val">${fmt(curShow?.startTime)} · ${fmtDate(curShow?.startTime)}</span></div>
      <div class="c-row"><span class="c-lbl">Theater</span><span class="c-val">${curShow?.screen?.theater?.name || 'Theater'}</span></div>
      <div class="c-row"><span class="c-lbl">Seats</span><span class="c-val" style="color:var(--red)">${selectedSeats.map(s => s.seatNumber).join(', ')}</span></div>
      <div class="c-row"><span class="c-lbl">Amount Paid</span><span class="c-val" style="color:var(--teal)">₹${b.totalAmount || total}</span></div>
      <div class="c-row"><span class="c-lbl">Payment</span><span class="c-val">${payMethod.replace('_', ' ')}</span></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a href="bookings.html" class="btn btn-red btn-lg">📋 View My Bookings</a>
      <a href="movies.html" class="btn btn-ghost btn-lg">🎬 Book Another</a>
    </div>
  </div></div>`;
      toast('🎉 Booking confirmed!', 'ok');
    }

    // Push a base "before booking" state so back from step 1 exits to movies
    history.replaceState({ step: 0 }, '', location.href);
    renderStep1();
  </script>
</body>

</html>

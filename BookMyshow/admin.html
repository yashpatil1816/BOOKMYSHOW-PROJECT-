<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — BookMyShow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap');

    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,700;0,900;1,700&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --red: #FF2D55;
      --red-glow: rgba(255, 45, 85, 0.25);
      --dark: #0B0B14;
      --dark2: #111121;
      --card: #16162A;
      --card2: #1E1E35;
      --line: rgba(255, 255, 255, 0.07);
      --line2: rgba(255, 255, 255, 0.13);
      --txt: #EEEEF8;
      --txt2: #9191B8;
      --txt3: #4A4A72;
      --gold: #FFBA00;
      --teal: #00D4AA;
      --blue: #4C8BFF;
      --sans: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      --serif: 'Fraunces', 'Georgia', serif
    }

    body {
      font-family: var(--sans);
      background: var(--dark);
      color: var(--txt);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 64px 1fr
    }

    ::-webkit-scrollbar {
      width: 3px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red)
    }

    .nav {
      grid-column: 1/-1;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(11, 11, 20, 0.97);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--line)
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 900;
      color: var(--txt);
      text-decoration: none
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--red);
      animation: pulse 2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .5;
        transform: scale(.8)
      }
    }

    .nav-badge {
      background: rgba(255, 186, 0, .12);
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 186, 0, .25);
      letter-spacing: .5px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      transition: all .18s;
      text-decoration: none;
      white-space: nowrap
    }

    .btn-red {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 20px var(--red-glow)
    }

    .btn-red:hover {
      background: #e02248;
      transform: translateY(-2px)
    }

    .btn-ghost {
      background: var(--card2);
      color: var(--txt);
      border: 1px solid var(--line2)
    }

    .btn-ghost:hover {
      background: var(--card)
    }

    .btn-outline {
      background: transparent;
      color: var(--txt2);
      border: 1.5px solid var(--line2)
    }

    .btn-outline:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .btn-teal {
      background: rgba(0, 212, 170, .12);
      color: var(--teal);
      border: 1px solid rgba(0, 212, 170, .25)
    }

    .btn-teal:hover {
      background: rgba(0, 212, 170, .2)
    }

    .btn-danger {
      background: rgba(255, 45, 85, .12);
      color: var(--red);
      border: 1px solid rgba(255, 45, 85, .25)
    }

    .btn-danger:hover {
      background: rgba(255, 45, 85, .2)
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 8px
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: var(--card2);
      color: var(--txt2);
      border: 1px solid var(--line)
    }

    /* SIDEBAR */
    .sidebar {
      margin-top: 64px;
      background: var(--dark2);
      border-right: 1px solid var(--line);
      padding: 20px 14px;
      height: calc(100vh - 64px);
      position: sticky;
      top: 64px;
      overflow-y: auto
    }

    .sb-section-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0 10px;
      margin: 16px 0 6px
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 500;
      color: var(--txt2);
      cursor: pointer;
      transition: .15s;
      margin-bottom: 2px
    }

    .sb-item:hover {
      background: var(--card);
      color: var(--txt)
    }

    .sb-item.on {
      background: rgba(255, 45, 85, .1);
      color: var(--red)
    }

    .sb-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      flex-shrink: 0
    }

    .sb-item .sb-count {
      margin-left: auto;
      background: var(--card2);
      color: var(--txt3);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 700
    }

    .sb-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--card);
      margin-top: auto
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%
    }

    /* MAIN */
    .main {
      margin-top: 64px;
      padding: 28px;
      overflow-y: auto;
      height: calc(100vh - 64px)
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px
    }

    .stat-card {
      background: var(--dark2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px
    }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 10px
    }

    .stat-val {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 900;
      color: var(--txt);
      line-height: 1;
      margin-bottom: 4px
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--txt3)
    }

    /* PANEL */
    .panel {
      background: var(--dark2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap
    }

    .panel-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700
    }

    /* TABLE */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--line)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      padding: 11px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--card);
      border-bottom: 1px solid var(--line)
    }

    td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tr:last-child td {
      border-bottom: none
    }

    tr:hover td {
      background: rgba(255, 255, 255, .02)
    }

    .td-mono {
      font-family: monospace;
      font-size: 12px;
      color: var(--txt2)
    }

    .td-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .form-grid .fw {
      grid-column: 1/-1
    }

    .fl {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .fl label {
      font-size: 11px;
      font-weight: 700;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 1px
    }

    .fl input,
    .fl select,
    .fl textarea {
      background: var(--dark);
      border: 1.5px solid var(--line2);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--txt);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: .18s;
      width: 100%
    }

    .fl input:focus,
    .fl select:focus,
    .fl textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255, 45, 85, .1)
    }

    .fl input::placeholder,
    .fl textarea::placeholder {
      color: var(--txt3)
    }

    .fl textarea {
      min-height: 76px;
      resize: vertical
    }

    .fl select option {
      background: var(--card2)
    }

    /* MODAL */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0, 0, 0, .82);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s
    }

    .ov.open {
      opacity: 1;
      pointer-events: all
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--line2);
      border-radius: 22px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(.94) translateY(18px);
      transition: transform .22s
    }

    .ov.open .modal {
      transform: none
    }

    .mh {
      padding: 22px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .mt-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700
    }

    .mc {
      width: 32px;
      height: 32px;
      background: var(--card2);
      border: none;
      border-radius: 9px;
      color: var(--txt2);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .15s
    }

    .mc:hover {
      background: var(--line);
      color: var(--txt)
    }

    .mb {
      padding: 20px 24px 26px
    }

    .toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--line2);
      border-radius: 14px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--txt);
      min-width: 240px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
      animation: tIn .3s ease
    }

    .toast.ok {
      border-left: 3px solid var(--teal)
    }

    .toast.err {
      border-left: 3px solid var(--red)
    }

    .toast.info {
      border-left: 3px solid var(--blue)
    }

    @keyframes tIn {
      from {
        transform: translateX(60px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes tOut {
      to {
        transform: translateX(60px);
        opacity: 0
      }
    }

    /* API LOG */
    .api-log {
      background: var(--dark);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      color: var(--txt2);
      max-height: 180px;
      overflow-y: auto
    }

    .log-line {
      padding: 4px 0;
      border-bottom: 1px solid var(--line)
    }

    .log-ok {
      color: var(--teal)
    }

    .log-err {
      color: var(--red)
    }

    .log-info {
      color: var(--blue)
    }

    @media(max-width:900px) {
      body {
        grid-template-columns: 1fr
      }

      .sidebar {
        display: none
      }

      .main {
        padding: 20px
      }
    }

    @media(max-width:560px) {
      .nav {
        padding: 0 16px;
        height: 58px
      }

      .main {
        padding: 14px
      }

      .card {
        padding: 16px
      }

      .stats-row {
        grid-template-columns: 1fr 1fr
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
        min-height: 44px
      }

      .btn {
        min-height: 44px;
        font-size: 13px
      }

      table {
        font-size: 12px
      }

      th,
      td {
        padding: 8px 10px
      }
    }

    /* ══ BOOKMYSHOW BRAND ══ */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .brand-mark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #FF1A1A;
      clip-path: polygon(0 15%, 50% 0, 100% 15%, 100% 85%, 50% 100%, 0 85%);
      animation: bPulse 3s ease-in-out infinite
    }

    @keyframes bPulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.08)
      }
    }

    .brand-f {
      position: relative;
      font-family: 'Unbounded', 'Impact', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #fff
    }

    .brand-name {
      font-family: 'Unbounded', 'Impact', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #F0F0FF
    }

    .brand-name em {
      color: #FF1A1A;
      font-style: normal
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="brand" href="index.html">
      <div class="brand-mark">
        <div class="brand-f">B</div>
      </div>
      <div class="brand-name">BOOK<em>MY</em>SHOW</div>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="nav-badge">⚡ Admin Panel</span>
      <a href="index.html" class="btn btn-ghost btn-sm">← Back to Site</a>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-section-lbl">Overview</div>
    <div class="sb-item on" id="nav-dash" onclick="showSection('dash',this)"><span class="sb-icon">📊</span>Dashboard
    </div>

    <div class="sb-section-lbl">Manage</div>
    <div class="sb-item" id="nav-movies" onclick="showSection('movies',this)"><span class="sb-icon">🎬</span>Movies<span
        class="sb-count" id="cnt-m">—</span></div>
    <div class="sb-item" id="nav-theaters" onclick="showSection('theaters',this)"><span
        class="sb-icon">🏛️</span>Theaters<span class="sb-count" id="cnt-t">—</span></div>
    <div class="sb-item" id="nav-screens" onclick="showSection('screens',this)"><span
        class="sb-icon">🖥️</span>Screens<span class="sb-count" id="cnt-sc">—</span></div>
    <div class="sb-item" id="nav-shows" onclick="showSection('shows',this)"><span class="sb-icon">🎭</span>Shows<span
        class="sb-count" id="cnt-s">—</span></div>
    <div class="sb-item" id="nav-users" onclick="showSection('users',this)"><span class="sb-icon">👥</span>Users<span
        class="sb-count" id="cnt-u">—</span></div>
    <div class="sb-item" id="nav-bookings" onclick="showSection('bookings',this)"><span
        class="sb-icon">🎫</span>Bookings<span class="sb-count" id="cnt-b">—</span></div>

    <div class="sb-section-lbl" style="margin-top:24px">Settings</div>
    <div class="sb-item" id="nav-api" onclick="showSection('api',this)"><span class="sb-icon">🔌</span>API Config</div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainArea">Loading...</main>

  <!-- MODALS -->
  <div class="ov" id="formOv" onclick="if(event.target===this)closeOv('formOv')">
    <div class="modal">
      <div class="mh">
        <div class="mt-title" id="formTitle">Form</div><button class="mc" onclick="closeOv('formOv')">✕</button>
      </div>
      <div class="mb" id="formBody"></div>
    </div>
  </div>
  <div class="ov" id="deleteOv" onclick="if(event.target===this)closeOv('deleteOv')">
    <div class="modal" style="max-width:380px">
      <div class="mh">
        <div class="mt-title">Confirm Delete</div><button class="mc" onclick="closeOv('deleteOv')">✕</button>
      </div>
      <div class="mb">
        <div style="color:var(--txt2);font-size:14px;margin-bottom:20px" id="deleteMsg">Are you sure?</div>
        <div style="display:flex;gap:10px"><button class="btn btn-danger" style="flex:1" id="deleteConfirmBtn">Yes,
            Delete</button><button class="btn btn-ghost" style="flex:1" onclick="closeOv('deleteOv')">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    let BASE = 'http://localhost:8080';
    let data = { movies: [], theaters: [], screens: [], shows: [], users: [], bookings: [], moviePricing: {} };
    let logs = [];

    async function api(m, p, b) {
      const t0 = Date.now();
      try {
        const o = { method: m, headers: { 'Content-Type': 'application/json' } };
        if (b) o.body = JSON.stringify(b);
        const r = await fetch(BASE + p, o);
        const txt = await r.text();
        let d; try { d = JSON.parse(txt) } catch { d = txt }
        const ms = Date.now() - t0;
        addLog(r.ok, 'ok', `${m} ${p} → ${r.status} (${ms}ms)`);
        return { ok: r.ok, data: d };
      } catch (e) {
        addLog(false, 'err', `${m} ${p} → ERROR: ${e.message}`);
        return { ok: false, data: { message: 'Cannot connect to ' + BASE } };
      }
    }

    function addLog(ok, type, msg) { logs.unshift({ ok, type, msg, t: new Date().toLocaleTimeString() }); if (logs.length > 50) logs.pop(); const el = document.getElementById('apiLog'); if (el) renderLog(el) }
    function renderLog(el) { el.innerHTML = logs.slice(0, 20).map(l => `<div class="log-line log-${l.ok ? 'ok' : 'err'}"><span style="color:var(--txt3)">${l.t}</span> ${l.msg}</div>`).join('') }

    function toast(msg, type = 'info') { const el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = `<span>${{ ok: '✅', err: '❌', info: 'ℹ️' }[type] || '•'}</span><span>${msg}</span>`; document.getElementById('toastWrap').appendChild(el); setTimeout(() => { el.style.animation = 'tOut .3s ease forwards'; setTimeout(() => el.remove(), 300) }, 3500) }
    function openOv(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden' }
    function closeOv(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow = '' }

    function showSection(sec, el) {
      document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('on'));
      el?.classList.add('on');
      const renders = { dash: renderDash, movies: renderMovies, theaters: renderTheaters, screens: renderScreens, shows: renderShows, users: renderUsers, bookings: renderBookings, api: renderAPI };
      renders[sec]?.();
    }

    async function loadAll() {
      const [mr, tr, scr, sr, ur] = await Promise.all([
        api('GET', '/api/movie/list'), api('GET', '/api/theater/list'), api('GET', '/api/screen/list'), api('GET', '/api/show/list'), api('GET', '/api/user/list')
      ]);
      if (mr.ok && Array.isArray(mr.data)) { data.movies = mr.data; document.getElementById('cnt-m').textContent = mr.data.length }
      if (tr.ok && Array.isArray(tr.data)) { data.theaters = tr.data; document.getElementById('cnt-t').textContent = tr.data.length }
      if (scr.ok && Array.isArray(scr.data)) { data.screens = scr.data; document.getElementById('cnt-sc').textContent = scr.data.length }
      if (sr.ok && Array.isArray(sr.data)) { data.shows = sr.data; document.getElementById('cnt-s').textContent = sr.data.length }
      if (ur.ok && Array.isArray(ur.data)) { data.users = ur.data; document.getElementById('cnt-u').textContent = ur.data.length }
      renderDash();
    }

    function statCard(icon, val, lbl, color = 'var(--txt)') { return `<div class="stat-card"><div class="stat-icon">${icon}</div><div class="stat-val" style="color:${color}">${val}</div><div class="stat-lbl">${lbl}</div></div>` }

    function renderDash() {
      document.getElementById('mainArea').innerHTML = `
  <div class="stats-row">
    ${statCard('🎬', data.movies.length, 'Total Movies', 'var(--blue)')}
    ${statCard('🏛️', data.theaters.length, 'Theaters', 'var(--teal)')}
    ${statCard('🎭', data.shows.length, 'Active Shows', 'var(--gold)')}
    ${statCard('👥', data.users.length, 'Users', 'var(--red)')}
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">⚡ Quick Actions</div></div>

    async function submitMovie() {
      const payload = { movieName: gv('f-title'), language: gv('f-lang'), genre: gv('f-genre'), duration: getDur(), realeseDate: gv('f-date'), posterUrl: gv('f-poster'), bannerUrl: gv('f-banner'), description: gv('f-desc'), amount: parseFloat(gv('f-amount')) || 0 };
      if (!payload.movieName) { toast('Movie title is required', 'err'); return }
      const r = await api('POST', '/api/movie/create', payload);
      if (r.ok) {
        savePricing(r.data?.id);
        toast('Movie added! 🎬', 'ok'); closeOv('formOv'); await loadAll(); renderMovies()
      } else toast(r.data?.message || 'Failed to add movie', 'err');
    }

    async function updateMovie(id) {
      const payload = { id, movieName: gv('f-title'), language: gv('f-lang'), genre: gv('f-genre'), duration: getDur(), realeseDate: gv('f-date'), posterUrl: gv('f-poster'), bannerUrl: gv('f-banner'), description: gv('f-desc'), amount: parseFloat(gv('f-amount')) || 0 };
      const r = await api('PUT', `/api/movie/update/${id}`, payload);
      if (r.ok) {
        savePricing(id);
        toast('Movie updated!', 'ok'); closeOv('formOv'); await loadAll(); renderMovies()
      } else toast(r.data?.message || 'Failed', 'err');
    }

      if (filterTheaterId !== undefined) { screenFilterId = filterTheaterId; screenFilterName = filterTheaterName || 'Theater'; }

      // Fetch fresh screen data
      const r = await api('GET', screenFilterId ? `/api/screen/theater/${screenFilterId}` : '/api/screen/list');
      const screens = (r.ok && Array.isArray(r.data)) ? r.data : data.screens;
      if (r.ok && Array.isArray(r.data)) { data.screens = r.data; document.getElementById('cnt-sc').textContent = data.screens.length; }

      const theaterOpts = data.theaters.map(t => `<option value="${t.id}" ${screenFilterId == t.id ? 'selected' : ''}>${t.name} (ID: ${t.id})</option>`).join('');

      document.getElementById('mainArea').innerHTML = `<div class="panel">
    <div class="panel-head">
      <div>

    async function loadSeatGrid(screenId) {
      const r = await api('GET', `/api/seat/screen/${screenId}`);

        return;

      // Group by row letter
      const rows = {};
      seats.forEach(s => {
        const row = s.seatNumber?.match(/^([A-Z]+)/)?.[1] || '?';
        if (!rows[row]) rows[row] = [];
        rows[row].push(s);
      });
      const typeColor = { RECLINER: 'var(--gold)', GOLD: '#a78bfa', NORMAL: 'var(--teal)' };
      wrap.innerHTML = `
        <div style="font-size:12px;color:var(--txt3);margin-bottom:8px">${seats.length} seats · 
          <span style="color:var(--gold)">■ RECLINER</span> &nbsp;
          <span style="color:#a78bfa">■ GOLD</span> &nbsp;
          <span style="color:var(--teal)">■ NORMAL</span>
        </div>
        <div style="max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
          ${Object.entries(rows).map(([row, ss]) => `

    // When movie picked — auto fill language + recalc end time
    function onShowMoviePick(sel) {
      const opt = sel.options[sel.selectedIndex];
      const lang = opt.dataset.lang;
      if (lang) {
        const ls = document.getElementById('f-lang');
        for (let o of ls.options) { if (o.value === lang) { ls.value = lang; break; } }
      }
      calcShowEnd();
    }

    // Auto-calculate end time from start time + movie duration
    function calcShowEnd() {
      const sel = document.getElementById('f-movieId');
      const startVal = document.getElementById('f-start')?.value;
      if (!sel || !startVal) return;
      const opt = sel.options[sel.selectedIndex];
      const durStr = opt?.dataset?.dur || '';
      if (!durStr) return;
      let mins = 0;
      const hm = durStr.match(/(\d+)\s*h/); const mm = durStr.match(/(\d+)\s*m/);
      if (hm) mins += parseInt(hm[1]) * 60;
      if (mm) mins += parseInt(mm[1]);
      if (!mins) return;
      const start = new Date(startVal);
      const end = new Date(start.getTime() + mins * 60000);
      const endISO = end.toISOString().slice(0, 16);
      const endStr = end.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      const preview = document.getElementById('show-end-preview');
      preview.style.display = 'block';
      preview.dataset.endiso = endISO;
      document.getElementById('show-dur-label').textContent = `Duration: ${durStr}`;
      document.getElementById('show-end-label').textContent = endStr;
    }

    async function submitShow() {
      const movieId = parseInt(gv('f-movieId'));
      const screenId = parseInt(gv('f-screenId'));
      const startTime = gv('f-start');
      const language = gv('f-lang');

      if (!movieId) { toast('Please select a movie', 'err'); return }
      if (!screenId) { toast('Please select a screen', 'err'); return }
      if (!startTime) { toast('Start time is required', 'err'); return }

      // End time — from auto-calculated preview, backend also recalculates from duration
      const preview = document.getElementById('show-end-preview');
      const endTime = preview?.dataset?.endiso || null;

      // ShowDto expects nested objects { movie:{id}, screen:{id} }
      const payload = {
        movie: { id: movieId },
        screen: { id: screenId },
        language: language,
        startTime: startTime + (startTime.length === 16 ? ':00' : ''),
        endTime: endTime ? endTime + (endTime.length === 16 ? ':00' : '') : null
      };

      const r = await api('POST', '/api/show/create', payload);
      if (r.ok) { toast('✅ Show added successfully!', 'ok'); closeOv('formOv'); await loadAll(); renderShows() }
      else toast(r.data?.message || 'Failed to add show', 'err');
    }

    }

    async function cancelBookingAdmin(id) {
      if (!confirm('Cancel booking #' + id + '?')) return;
      const r = await api('PUT', `/api/booking/cancel/${id}`);
      if (r.ok) { toast('Booking cancelled', 'ok'); fetchAdminBookings() }
      else toast(r.data?.message || 'Failed', 'err');
    }

    /* ─── API CONFIG ─── */
    function renderAPI() {
      document.getElementById('mainArea').innerHTML = `
  <div class="panel">
    <div class="panel-head"><div class="panel-title">🔌 API Configuration</div></div>
    <div class="fl" style="max-width:500px;margin-bottom:20px">
      <label>Backend Base URL</label>
      <input type="url" id="apiUrl" value="${BASE}" placeholder="http://localhost:8080"/>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-red" onclick="testConnection()">Test Connection</button>
      <button class="btn btn-ghost" onclick="loadAll()">Reload All Data</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">📡 API Reference</div></div>
    <div style="font-family:monospace;font-size:13px">
      ${[['GET', '/api/movie/list', 'List all movies'], ['POST', '/api/movie/create', 'Create movie'], ['GET', '/api/theater/list', 'List theaters'], ['POST', '/api/theater/create', 'Create theater'], ['GET', '/api/show/list', 'List shows'], ['POST', '/api/show/create', 'Create show'], ['POST', '/api/booking/create', 'Create booking'], ['GET', '/api/booking/user/{id}', 'User bookings'], ['PUT', '/api/booking/cancel/{id}', 'Cancel booking'], ['GET', '/api/user/list', 'List users'], ['POST', '/api/user/create', 'Create user']]
          .map(([m, p, d]) => `<div style="display:grid;grid-template-columns:60px 220px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center"><span style="color:${m === 'GET' ? 'var(--teal)' : m === 'POST' ? 'var(--blue)' : 'var(--gold)'};font-weight:700">${m}</span><span style="color:var(--txt)">${p}</span><span style="color:var(--txt2);font-size:12px">${d}</span></div>`).join('')}
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">🧪 Sample Booking Payload</div></div>
    <div class="api-log" style="color:var(--teal)">POST /api/booking/create<br/>{"userId":1,"showId":1,"seatId":[1,2],"paymentMethod":"UPI"}</div>
  </div>`;
    }

    async function testConnection() {
      const newUrl = document.getElementById('apiUrl')?.value?.trim();
      if (newUrl) BASE = newUrl.replace(/\/$/, '');
      const r = await api('GET', '/api/movie/list');
      if (r.ok) toast('Connected! Found ' + r.data.length + ' movies.', 'ok');
      else toast('Cannot connect to backend at ' + BASE, 'err');
    }

    /* ─── GENERIC DELETE ─── */
    function deleteItem(type, id, name) {
      document.getElementById('deleteMsg').innerHTML = `Delete <strong>${name}</strong>? This action cannot be undone.`;
      document.getElementById('deleteConfirmBtn').onclick = async () => {
        const paths = { movie: `/api/movie/delete/${id}`, theater: `/api/theater/delete/${id}`, user: `/api/user/delete/${id}` };
        const r = await api('DELETE', paths[type]);
        if (r.ok) { toast(`${name} deleted`, 'ok'); closeOv('deleteOv'); await loadAll(); showSection(type + 's', document.getElementById('nav-' + type + 's')) }
        else toast(r.data?.message || 'Delete failed', 'err');
      };
      openOv('deleteOv');
    }


    // ── DURATION PREVIEW ──
    function updateDurPreview() {
      const el = document.getElementById('dur-preview');
      if (el) el.textContent = getDur() || '—';
    }

    // ── PRICE AUTO-CALC (movie form) ──
    function syncAmountToNormal(val) {
      const base = parseFloat(val) || 0;
      if (!base) return;
      const n = document.getElementById('f-price-normal');
      if (n) { n.value = base; autoCalcPrices('normal'); }
    }
    function autoCalcPrices(changed) {
      const n = parseFloat(document.getElementById('f-price-normal')?.value) || 0;
      const g = document.getElementById('f-price-gold');
      const r = document.getElementById('f-price-recliner');
      if (changed === 'normal') {
        if (g) g.value = Math.round(n * 1.5);
        if (r) r.value = Math.round(n * 2);
      }
      // If gold/recliner changed manually — keep as is (user override)
    }

    // autoCalcScreenPrices removed — pricing lives in Movie form only

    // ── SAVE MOVIE PRICING to local data store ──
    function savePricing(movieId) {
      if (!movieId) return;
      data.moviePricing[movieId] = {
        normal: parseInt(document.getElementById('f-price-normal')?.value) || 200,
        gold: parseInt(document.getElementById('f-price-gold')?.value) || 350,
        recl: parseInt(document.getElementById('f-price-recliner')?.value) || 600
      };
    }

    function gv(id) { return document.getElementById(id)?.value || '' }

    // ── DURATION PICKER ──
    function adjDur(unit, delta) {
      const el = document.getElementById(unit === 'h' ? 'f-dur-h' : 'f-dur-m');
      if (!el) return;
      let v = parseInt(el.value) || 0;
      if (unit === 'h') el.value = Math.min(9, Math.max(0, v + delta));
      else { v = Math.min(55, Math.max(0, Math.round((v + delta) / 5) * 5)); el.value = v; }
      calcShowEnd();
    }
    function getDur() {
      const h = parseInt(document.getElementById('f-dur-h')?.value) || 0;
      const m = parseInt(document.getElementById('f-dur-m')?.value) || 0;
      if (!h && !m) return '';
      return (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm' : '');
    }
    function parseDurToHM(str) {
      if (!str) return [2, 30];
      const hm = str.match(/(\d+)\s*h/); const mm = str.match(/(\d+)\s*m/);
      return [hm ? parseInt(hm[1]) : 0, mm ? parseInt(mm[1]) : 0];
    }
    function esc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    loadAll();
  </script>
</body>

</html>
